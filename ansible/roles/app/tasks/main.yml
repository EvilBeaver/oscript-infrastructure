---
- name: Согласованность compose_files и compose_file_env
  ansible.builtin.assert:
    that:
      - compose_file_env == (compose_files | join(':'))
    fail_msg: "compose_file_env должен совпадать с compose_files через ':'"
  tags:
    - app
    - never

- name: deploy_ref обязателен при изменяющих флагах app
  ansible.builtin.assert:
    that:
      - deploy_ref is defined
      - (deploy_ref | string | length) > 0
    fail_msg: "Передайте -e deploy_ref=feature/multi-host (или нужную ветку)"
  when: app_checkout | bool or app_apply | bool or app_compose_up | bool
  tags:
    - app
    - never

- name: Проверить git status перед checkout
  ansible.builtin.command:
    cmd: git status --porcelain --untracked-files=no
    chdir: "{{ stack_dir }}"
  register: app_git_status
  changed_when: false
  failed_when: false
  become: false
  check_mode: false
  when: app_checkout | bool
  tags:
    - app
    - never

- name: Запретить checkout при локальных правках tracked-файлов
  ansible.builtin.assert:
    that:
      - app_git_status.stdout | length == 0
    fail_msg: "В {{ stack_dir }} есть локальные изменения tracked-файлов; checkout отменён"
  when:
    - app_checkout | bool
    - app_git_status.rc == 0
  tags:
    - app
    - never

- name: Обновить репозиторий стека
  ansible.builtin.git:
    repo: https://github.com/EvilBeaver/oscript-infrastructure.git
    dest: "{{ stack_dir }}"
    version: "{{ deploy_ref }}"
    update: true
  become: false
  when: app_checkout | bool
  tags:
    - app
    - never

# 2775 только у каталогов (setgid, группа oscript — участники группы правят репозиторий).
# Mode файлов не трогать: recurse file+2775 делает privkey.pem и .env читаемыми для всех.
- name: Владелец дерева стека
  ansible.builtin.shell: |
    set -euo pipefail
    find "{{ stack_dir }}" -type d -exec chown deploy:oscript {} +
    find "{{ stack_dir }}" -type d -exec chmod 2775 {} +
    find "{{ stack_dir }}" -type f -exec chown deploy:oscript {} +
  args:
    executable: /bin/bash
  when: app_checkout | bool or app_apply | bool
  tags:
    - app
    - never

# Групповая запись в .git: без sharedRepository=group git пишет файлы 0644, и первый же
# git gc/pack-refs возвращает reflog в 0644 — участник группы получает
# «unable to append to '.git/logs/HEAD': Permission denied». Режим «group» — это umask 002
# для всего, что git создаёт сам (файлы 664, каталоги 2775).
- name: Групповой режим git в репозитории стека
  ansible.builtin.command:
    cmd: git config core.sharedRepository group
    chdir: "{{ stack_dir }}"
  become: false
  changed_when: false
  when: app_checkout | bool or app_apply | bool
  tags:
    - app
    - never

# Существующие reflog-файлы git сам не пересоздаёт: в файл 0644 участник группы писать
# не может, поэтому правим режим руками (дальше его держит sharedRepository).
- name: Reflog-файлы репозитория доступны группе на запись
  ansible.builtin.shell: |
    set -euo pipefail
    [ -d "{{ stack_dir }}/.git/logs" ] || exit 0
    find "{{ stack_dir }}/.git/logs" -type d -exec chmod g+sw {} +
    find "{{ stack_dir }}/.git/logs" -type f -exec chmod g+w {} +
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  when: app_checkout | bool or app_apply | bool
  tags:
    - app
    - never

- name: GID группы docker
  ansible.builtin.command:
    cmd: getent group docker
  register: app_docker_group
  changed_when: false
  when: app_apply | bool
  tags:
    - app
    - never

- name: DOCKER_GID
  ansible.builtin.set_fact:
    app_docker_gid: "{{ app_docker_group.stdout.split(':')[2] }}"
  when: app_apply | bool
  tags:
    - app
    - never

- name: Проверить обязательные ключи .env
  ansible.builtin.assert:
    that:
      - item in vars
      - (vars[item] | string | length) > 0
    fail_msg: "Для .env не задано или пусто: {{ item }}"
  loop: "{{ app_env_required_keys }}"
  loop_control:
    label: "{{ item }}"
  when: app_apply | bool
  no_log: true
  tags:
    - app
    - never

- name: Проверить OTEL_HOST_NAME и DOCKER_GID
  ansible.builtin.assert:
    that:
      - otel_host_name is defined
      - (otel_host_name | string | length) > 0
      - app_docker_gid is defined
      - (app_docker_gid | string | length) > 0
  when: app_apply | bool
  tags:
    - app
    - never

- name: Каталог бэкапов .env
  ansible.builtin.file:
    path: /var/lib/oscript/env-backups
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"
  when: app_apply | bool
  tags:
    - app
    - never

- name: Есть ли .env
  ansible.builtin.stat:
    path: "{{ stack_dir }}/.env"
  register: app_env_stat
  when: app_apply | bool
  tags:
    - app
    - never

- name: Бэкап .env перед записью
  ansible.builtin.copy:
    src: "{{ stack_dir }}/.env"
    dest: "/var/lib/oscript/env-backups/.env-{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    owner: deploy
    group: deploy
    mode: "0600"
  when:
    - app_apply | bool
    - app_env_stat.stat.exists
  tags:
    - app
    - never

- name: Записать .env
  ansible.builtin.template:
    src: "env-{{ inventory_hostname }}.j2"
    dest: "{{ stack_dir }}/.env"
    owner: deploy
    group: oscript
    mode: "0770"
  no_log: true
  diff: false
  when: app_apply | bool
  tags:
    - app
    - never

- name: Поднять стек compose
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    project_name: "{{ project_name }}"
    files: "{{ compose_files }}"
    env_files:
      - .env
    state: present
  no_log: true
  when: app_compose_up | bool
  tags:
    - app
    - never
