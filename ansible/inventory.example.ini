# Пример для syntax-check и документации. Не для прогона плейбука (inventory_is_example=true).
# Боевой ansible/inventory.ini на B (в git нет):
#   [oscript:vars]
#   inventory_is_example=false
#   [worker]
#   node_b ansible_connection=local
#   [edge]
#   node_a ansible_host=<публичный IP A> ansible_python_interpreter=/opt/python3/bin/python3

[oscript:children]
edge
worker

[oscript:vars]
inventory_is_example=true

[edge]
node_a ansible_host=192.0.2.1 public_ip=192.0.2.1 ansible_user=deploy ansible_python_interpreter=/opt/python3/bin/python3 ansible_ssh_private_key_file=/home/deploy/.ssh/oscript_deploy

[worker]
node_b ansible_host=192.0.2.2 public_ip=192.0.2.2 ansible_user=deploy
