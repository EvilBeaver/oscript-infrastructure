---
spoofdpi_enabled: false
firewall_profile: worker
otel_host_name: oscript-b
nginx_status_endpoint: http://10.9.0.1:8080/nginx_status
compose_files:
  - compose/node_b.compose.yaml
compose_file_env: compose/node_b.compose.yaml

app_env_required_keys:
  - MINIO_ROOT_USER
  - MINIO_ROOT_PASSWORD
  - JENKINS_S3_ACCESS_KEY
  - JENKINS_S3_SECRET_KEY
  - OPENHUB_S3_ACCESS_KEY
  - OPENHUB_S3_SECRET_KEY
  - GRAFANA_ADMIN_PASSWORD
  - GRAFANA_DB_PASSWORD
  - NGINX_STATUS_ENDPOINT
