---
# CPython 3.12 вне PATH. ansible-core 2.21 на /usr/bin/python3 (3.5.2) падает.
# Ручной вызов на A: /opt/python3/bin/python3 script.py
ansible_python_interpreter: /opt/python3/bin/python3

spoofdpi_enabled: true
firewall_profile: edge
otel_host_name: oscript.io
# На этапе 7 оба поля переключить на overrides/split.yml вместе.
compose_files:
  - compose/node_a.compose.yaml
  - compose/overrides/colocated.yml
compose_file_env: compose/node_a.compose.yaml:compose/overrides/colocated.yml

app_env_required_keys:
  - publish_secret
  - TELEGRAM_TOKEN
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - S3_BUCKET
  - OPENHUB_DB_PASSWORD
  - OPENHUB_S3_ACCESS_KEY
  - OPENHUB_S3_SECRET_KEY
  - GRAFANA_ADMIN_PASSWORD
  - GRAFANA_DB_PASSWORD
  - MINIO_ROOT_USER
  - MINIO_ROOT_PASSWORD
  - JENKINS_S3_ACCESS_KEY
  - JENKINS_S3_SECRET_KEY
