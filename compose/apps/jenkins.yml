services:
  jenkins:
    container_name: os_jenkins_1
    build: ../../jenkins
    image: osjenkins
    environment:
      # Без предела JVM берёт под кучу четверть памяти машины (988 МиБ из 4 ГБ) и держит её,
      # хотя живых данных не больше 320 МиБ. Замер 2026-09-27: процесс 1,67 ГБ, из них 1,1 ГБ
      # в свопе, на него приходится 81–93 % тяжёлых страничных отказов сервера.
      # jenkins.sh склеивает JAVA_OPTS с JENKINS_JAVA_OPTS из образа, они друг друга не затирают.
      - JAVA_OPTS=-Xmx640m
      - HTTPS_PROXY=http://host.docker.internal:8888
      - HTTP_PROXY=http://host.docker.internal:8888
      - NO_PROXY=localhost,127.0.0.1,s3.oscript.io,10.9.0.1,10.9.0.2,minio,lgtm,openhub
    ports:
      - "8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
      - web_content:/var/www
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
