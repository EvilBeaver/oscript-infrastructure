services:
  minio:
    container_name: os_minio_1
    build: ../../minio
    restart: always
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - JENKINS_S3_ACCESS_KEY
      - JENKINS_S3_SECRET_KEY
      - OPENHUB_S3_ACCESS_KEY
      - OPENHUB_S3_SECRET_KEY
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
