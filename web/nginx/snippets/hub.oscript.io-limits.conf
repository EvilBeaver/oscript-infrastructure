# Пределы частоты hub.oscript.io — подключается в оба сервера сайта (https и http с пушем).
# Зоны, темпы и распознавание роботов — в conf.d/hub-limits.conf.
# nodelay: запросы в пределах всплеска проходят сразу, сверх него — отказ, очереди нет.
# На http-сервере редирект на https пределами не считается: return срабатывает раньше
# limit_req и стоит nginx не дороже отказа; в хаб по http идёт только пуш — он под пределами.

limit_req  zone=hub_robots    burst=10  nodelay;    # робот по агенту: 30 в минуту
limit_req  zone=hub_per_addr  burst=500 nodelay;    # любой клиент по адресу: 50 в секунду
limit_conn hub_conn_per_addr  64;                   # одновременных запросов с адреса

limit_req_status     429;
limit_conn_status    429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# Retry-After nginx сам не ставит: отказ уходит в именованную локацию, она его добавляет.
# 429 от самого хаба сюда не попадают: без proxy_intercept_errors error_page ловит только
# ответы, которые nginx сформировал сам.
error_page 429 @hub_too_many_requests;

location @hub_too_many_requests {
    default_type text/plain;
    add_header Retry-After 60 always;
    return 429 "Too many requests. Retry later.\n";
}
