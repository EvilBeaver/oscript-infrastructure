# Трассировка OpenTelemetry: https://nginx.org/ru/docs/ngx_otel_module.html
# Спаны уходят в коллектор lgtm по OTLP/gRPC (nginx умеет только gRPC, поэтому 4317, а не 4318).
otel_exporter {
    endpoint lgtm:4317;
}

otel_service_name nginx;

# Спаны — по семконвенции OTel для HTTP server span (semconv 1.44.0, Stable):
# https://opentelemetry.io/docs/specs/semconv/http/http-spans/
# Kind SERVER и статус Error только для 5xx модуль ставит сам.

# {method}: известный метод как есть, иначе HTTP; атрибут http.request.method — _OTHER.
# Строки в map сравниваются без учёта регистра — это и есть приведение к канону по спеке.
map $request_method $otel_method {
    default HTTP;
    GET     GET;
    HEAD    HEAD;
    POST    POST;
    PUT     PUT;
    DELETE  DELETE;
    CONNECT CONNECT;
    OPTIONS OPTIONS;
    TRACE   TRACE;
    PATCH   PATCH;
    QUERY   QUERY;
}

map $otel_method $otel_method_attr {
    HTTP    _OTHER;
    default $otel_method;
}

# {target}: низкокардинальный маршрут. Своей маршрутизации по путям у nginx нет (всё идёт
# в "location /"), поэтому маршрут берём из OpenHub — шаблоны совпадают с путями его OpenAPI
# (ПутиОписанияAPI.os). Только горячие пути хаба; для остальных маршрута нет, и имя спана —
# просто {method}: спека запрещает подставлять вместо маршрута путь или его обрезки.
# Регулярки проверяются по порядку, срабатывает первая.
map $uri $otel_route {
    default "";

    "/"                    "/";
    "/download/list.txt"   "/download/list.txt";
    "/dev-channel/list.txt" "/dev-channel/list.txt";
    "/push"                "/push";

    "~^/(?<otel_ch>download|dev-channel)/[^/]+/[^/]+$"  "/$otel_ch/{name}/{file}";

    "~^(?<otel_api>/api/v1)?/pools/[^/]+/channels/[^/]+/download/list\.txt$"
        "$otel_api/pools/{pool}/channels/{channel}/download/list.txt";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/channels/[^/]+/download/[^/]+/[^/]+$"
        "$otel_api/pools/{pool}/channels/{channel}/download/{name}/{file}";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/download/list\.txt$"
        "$otel_api/pools/{pool}/download/list.txt";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/download/[^/]+/[^/]+$"
        "$otel_api/pools/{pool}/download/{name}/{file}";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/push$"
        "$otel_api/pools/{pool}/push";
}

map $otel_route $otel_span_target {
    ""      "";
    default " $otel_route";
}

otel_span_name "$otel_method$otel_span_target";

# url.path — путь из исходной строки запроса, без query
map $request_uri $otel_url_path {
    "~^(?<otel_path>[^?]*)" "$otel_path";
}

map $server_protocol $otel_protocol_version {
    default    "";
    "HTTP/1.0" "1.0";
    "HTTP/1.1" "1.1";
    "HTTP/2.0" "2";
    "HTTP/3.0" "3";
}

# Стабильные атрибуты — в дополнение к старым (http.method, http.target, net.*), которые модуль
# пишет всегда. Ограничения модуля: otel_span_attr — только строки (status_code и порты не int)
# и добавляется всегда, поэтому атрибуты «только если…» (url.query, error.type) не пишем,
# а http.request.method_original пишем всегда. http.route тоже не задать: модуль уже пишет
# его сам как имя location ("/"), а повторный ключ дал бы дубль — маршрут есть в имени спана.
otel_span_attr http.request.method          $otel_method_attr;
otel_span_attr http.request.method_original $request_method;
otel_span_attr url.path                     $otel_url_path;
otel_span_attr url.scheme                   $scheme;
otel_span_attr server.address               $host;
otel_span_attr server.port                  $server_port;
otel_span_attr client.address               $remote_addr;
otel_span_attr network.peer.address         $remote_addr;
otel_span_attr network.peer.port            $remote_port;
otel_span_attr network.protocol.version     $otel_protocol_version;
otel_span_attr user_agent.original          $http_user_agent;
otel_span_attr http.response.status_code    $status;

otel_trace on;

# W3C traceparent/tracestate: если клиент прислал контекст, nginx продолжает его трассу
# (trace id сохраняется, спан nginx — дочерний к клиентскому), иначе начинает новую.
# В бэкенд (openhub) уходит тот же trace id с parent-id спана nginx, и бэкенд встаёт
# к nginx дочерним. Модуль правит сам запрос, поэтому proxy_set_header в локациях
# заголовок не перебивают.
otel_trace_context propagate;
