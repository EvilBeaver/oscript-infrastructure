# Трассировка OpenTelemetry: https://nginx.org/ru/docs/ngx_otel_module.html
# Спаны уходят в коллектор lgtm по OTLP/gRPC (nginx умеет только gRPC, поэтому 4317, а не 4318).
otel_exporter {
    endpoint lgtm:4317;
}

otel_service_name nginx;

otel_trace on;

# В каждый проксируемый запрос — свежий W3C traceparent: бэкенд (openhub) продолжит трассу
# дочерним спаном к спану nginx. Входящий traceparent клиента перезаписывается —
# снаружи trace id не задают. Модуль правит сам запрос, поэтому proxy_set_header
# в локациях заголовок не перебивают.
otel_trace_context inject;
