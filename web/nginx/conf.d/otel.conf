# Трассировка OpenTelemetry: https://nginx.org/ru/docs/ngx_otel_module.html
# Спаны уходят в коллектор lgtm по OTLP/gRPC (nginx умеет только gRPC, поэтому 4317, а не 4318).
otel_exporter {
    endpoint lgtm:4317;
}

otel_service_name nginx;

# Имя спана — "{метод} {шаблон маршрута}" (семконвенция OTel), а не имя location:
# у всех сайтов проксирование идёт через "location /", и без этого все спаны называются "/".
# Сырой путь не годится: Tempo строит span-metrics с меткой span_name, и каждый файл пакета
# дал бы свою серию. Поэтому горячие пути хаба (маршруты OpenHub и старого opm-hub) сведены
# к шаблонам, остальное — к первому сегменту пути. Точный путь остаётся в атрибуте http.target.
# Регулярки проверяются по порядку, срабатывает первая.
map $uri $otel_route {
    default "/";

    "~^(?<otel_api>/api/v1)?/pools/[^/]+/channels/[^/]+/download/list\.txt$"
        "$otel_api/pools/{pool}/channels/{channel}/download/list.txt";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/channels/[^/]+/download/[^/]+/[^/]+$"
        "$otel_api/pools/{pool}/channels/{channel}/download/{name}/{file}";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/download/list\.txt$"
        "$otel_api/pools/{pool}/download/list.txt";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/download/[^/]+/[^/]+$"
        "$otel_api/pools/{pool}/download/{name}/{file}";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/(?<otel_sub>[^/]+)/."
        "$otel_api/pools/{pool}/$otel_sub/*";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/(?<otel_sub>[^/]+)$"
        "$otel_api/pools/{pool}/$otel_sub";
    "~^(?<otel_api>/api/v1)?/pools/[^/]+/?$"
        "$otel_api/pools/{pool}";

    "~^/(?<otel_ch>download|dev-channel)/list\.txt$"    "/$otel_ch/list.txt";
    "~^/(?<otel_ch>download|dev-channel)/[^/]+/[^/]+$"  "/$otel_ch/{name}/{file}";

    "~^/(?<otel_seg>[^/]+)/."                            "/$otel_seg/*";
    "~^/(?<otel_seg>[^/]+)/?$"                           "/$otel_seg";
}

otel_span_name "$request_method $otel_route";

otel_trace on;

# W3C traceparent/tracestate: если клиент прислал контекст, nginx продолжает его трассу
# (trace id сохраняется, спан nginx — дочерний к клиентскому), иначе начинает новую.
# В бэкенд (openhub) уходит тот же trace id с parent-id спана nginx, и бэкенд встаёт
# к nginx дочерним. Модуль правит сам запрос, поэтому proxy_set_header в локациях
# заголовок не перебивают.
otel_trace_context propagate;
