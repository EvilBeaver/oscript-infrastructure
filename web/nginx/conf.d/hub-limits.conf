# Ограничение частоты запросов к hub.oscript.io: здесь зоны и распознавание роботов,
# сами пределы (всплески, число одновременных) и ответ 429 — в snippets/hub.oscript.io-limits.conf,
# его подключают оба сервера сайта. Другие сайты этих зон не используют.
#
#   роботы по агенту — 30 запросов в минуту на робота, всплеск 10;
#   любой клиент     — 50 запросов в секунду с адреса, всплеск 500;
#   одновременно     — не больше 64 запросов с адреса.

# Робот считается по имени, а не по адресу: краулер ходит с десятков адресов, а версии
# в строке агента меняет. Значение — имя робота, у всех его адресов и версий один бюджет.
# Пустое значение — не робот: такие запросы зона роботов не считает.
# Регулярки проверяются сверху вниз, срабатывает первая; регистр не важен.
map $http_user_agent $hub_robot {
    default "";

    # не роботы, хотя похожи
    "~*statuscake"     "";    # мониторинг доступности
    "~*openhub-proxy"  "";    # зеркала других хабов
    "~*cubot"          "";    # телефоны Cubot: «bot» в модели устройства

    # роботы, в имени которых нет слов bot, crawler, spider, slurp
    "~*facebookexternalhit"    facebookexternalhit;
    "~*meta-externalagent"     meta-externalagent;
    "~*meta-externalfetcher"   meta-externalfetcher;
    "~*googleother"            GoogleOther;
    "~*google-read-aloud"      Google-Read-Aloud;
    "~*google-inspectiontool"  Google-InspectionTool;
    "~*bingpreview"            BingPreview;
    "~*chatgpt-user"           ChatGPT-User;
    "~*perplexity-user"        Perplexity-User;
    "~*claude-user"            Claude-User;
    "~*anthropic-ai"           anthropic-ai;
    "~*cohere-ai"              cohere-ai;
    "~*mistralai-user"         MistralAI-User;
    "~*ia_archiver"            ia_archiver;
    "~*barkrowler"             Barkrowler;
    "~*img2dataset"            img2dataset;
    "~*scrapy"                 Scrapy;
    "~*nutch"                  Nutch;
    "~*heritrix"               Heritrix;

    # всё, что называет себя ботом, краулером или пауком: Googlebot, PerplexityBot, GPTBot,
    # Bytespider, PetalBot, Yahoo! Slurp… Ключ — слово целиком без версии, не длиннее 50 знаков.
    "~*(?<hub_robot_word>[a-z0-9._-]{0,40}(?:bot|crawler|spider|slurp))"  $hub_robot_word;
}

limit_req_zone  $hub_robot          zone=hub_robots:1m     rate=30r/m;

# Предел по адресу — предохранитель от обезумевшего клиента, живых он задевать не должен.
# 50/с и всплеск 500 сняты моделью дырявого ведра по журналу nginx за трое суток: отказов
# ноль у всех; при 30/с и всплеске 300 ночное зеркало на Wget теряло 409 запросов из 5284.
# Адрес — не всегда один клиент: 172.18.0.1 — шлюз докера, с него на свой внешний адрес
# ходят зеркала самого стека (openhub-proxy, около 3 % запросов, пик 301 в минуту).
limit_req_zone  $binary_remote_addr zone=hub_per_addr:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=hub_conn_per_addr:10m;
