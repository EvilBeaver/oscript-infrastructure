[defaults]
# Нода A: ansible/host_vars/node_a.yml задаёт /opt/python3/bin/python3.
# Автопоиск на Xenial берёт /usr/bin/python3 (3.5.2), ansible-core 2.21 на нём падает.
inventory = ansible/inventory.ini
roles_path = ansible/roles
host_key_checking = True
remote_user = deploy
retry_files_enabled = False

[privilege_escalation]
become = true
become_method = sudo
